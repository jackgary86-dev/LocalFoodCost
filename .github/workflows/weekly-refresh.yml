name: Weekly price refresh

# New grocery ads come out on Wednesdays. 15:00 UTC is 10 AM in Longview (CDT).
on:
  schedule:
    - cron: "0 15 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the ad-reading rules
        run: python -m unittest discover -s tests
      - name: Rebuild index.html from this week's ads
        run: python -I build.py
      - name: Check the page script still parses
        run: |
          python -I -c "import re;h=open('index.html',encoding='utf-8').read();open('page.js','w',encoding='utf-8').write(re.findall(r'<script>(.*?)</script>',h,re.S)[-1])"
          node --check page.js && rm page.js
      - name: Commit if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history
          git diff --cached --quiet || git commit -m "Weekly price refresh $(date -u +%Y-%m-%d)"
          git push
